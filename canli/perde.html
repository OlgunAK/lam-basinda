<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#160F21">
<title>Lam Başında Canlı · Perde</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../ortak/tasarim.css">
<style>
/* Perde: koyu sınıf teması, salonun arkasından okunur. Ölçüler vw/vh ile; projektörde de dizüstünde de aynı oran.
   Renkler ortak/tasarim.css rollerinden. */
:root{
  /* Sayfaya özgü */
  --c-letterbox:#000; --c-qr-bg:#fff; --c-img-bg:#fff; --c-scrim:rgb(0 0 0 / .62);
  --c-bar:color-mix(in oklab,var(--c-accent) 40%,var(--c-surface-2));
  --c-bar-ok:color-mix(in oklab,var(--c-ok) 38%,var(--c-surface-2));
  --c-bar-before:rgb(183 166 204 / .5);
  --c-on-ok:var(--c-bg); --c-on-bad:var(--c-bg);
  --c-badge-bg:color-mix(in oklab,var(--c-bg) 92%,transparent);
  /* perde.js satır içi stillerde eski adları kullanıyor: ince takma adlar */
  --muted:var(--c-text-2); --hema:var(--c-bar);
}
html,body{height:100%}
html{font-size:clamp(16px,1.05vw,26px)}
body{overflow:hidden;font-size:clamp(14px,1.15vw,22px);caret-color:var(--c-accent);scrollbar-color:var(--c-line-strong) transparent}
:focus-visible{outline-width:.18rem}
#stage{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}

/* Üst bant */
.topbar{display:flex;align-items:center;gap:1.2vw;padding:1.6vh 2.2vw 0}
.chip{display:inline-flex;align-items:center;gap:.5em;font-family:var(--f-display);font-weight:650;font-size:1.05rem;letter-spacing:-.01em;color:var(--c-text);white-space:nowrap}
.chip::before{content:"";flex:none;width:2.2em;height:2.2em;background:url("../ortak/isaret.svg") center/contain no-repeat}
.lbl{font-weight:600;color:var(--c-text-2);font-size:1.05rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:1vw;border-left:1px solid var(--c-line)}
.prog{color:var(--c-text-2);font-weight:600;font-variant-numeric:tabular-nums}
.timer{font-weight:700;font-size:1.6rem;color:var(--c-now);font-variant-numeric:tabular-nums}
.join{display:flex;align-items:center;gap:.8vw;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-lg);padding:.5em .8em}
.join .qr{width:min(7vw,12vh);aspect-ratio:1;background:var(--c-qr-bg);border-radius:.4em;padding:.25em}
.join .qr svg,.join .qr img{width:100%;height:100%;display:block}
.join .u{display:flex;flex-direction:column;line-height:1.2}
.join .u small{color:var(--c-text-2);font-size:.8rem}
.join .u b{font-size:1.6rem;font-weight:700;letter-spacing:.12em;font-variant-numeric:tabular-nums;color:var(--c-text)}
.stat{display:flex;flex-direction:column;align-items:center;min-width:4.5em}
.stat b{font-size:1.7rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat small{color:var(--c-text-2);font-size:.75rem}

/* Ana alan */
main{min-height:0;overflow:hidden;padding:2vh 2.2vw 1vh;display:flex;flex-direction:column;gap:2vh}
.q{font-family:var(--f-display);font-weight:650;font-size:clamp(20px,2.1vw,46px);line-height:1.25;letter-spacing:-.01em;max-width:70em;text-wrap:balance}
.q.long{font-size:clamp(18px,1.7vw,36px)}
.viz{flex:1;min-height:0;display:flex;gap:2vw}
.viz .side{flex:0 0 auto;max-width:38%;display:flex;align-items:flex-start}
.viz .side img{max-width:100%;max-height:100%;border-radius:var(--r-md);object-fit:contain;background:var(--c-img-bg);outline:1px solid var(--c-img-edge);outline-offset:-1px}
.viz .res{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:1.2vh;justify-content:safe center}

/* Çubuklar */
.bars{display:flex;flex-direction:column;gap:1.3vh}
.barrow{display:grid;grid-template-columns:2.2em 1fr 7.5em;align-items:center;gap:.8em}
.barrow .L{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:var(--c-accent);color:var(--c-on-accent);font-weight:700}
.barrow .T{position:relative;background:var(--c-surface-2);border-radius:var(--r-md);min-height:3em;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.barrow .T .f{position:absolute;inset:0 auto 0 0;background:var(--c-bar);transition:width .5s ease-out}
.barrow .T .f.g{background:var(--c-bar-before);top:auto;bottom:0;height:22%}
.barrow .T span{position:relative;padding:.35em .9em;font-weight:650;font-size:1.45rem;line-height:1.25}
.barrow .N{text-align:right;font-weight:700;font-size:1.45rem;font-variant-numeric:tabular-nums}
.barrow .N small{display:block;color:var(--c-text-2);font-weight:500;font-size:.75rem}
.barrow.ok .L{background:var(--c-ok);color:var(--c-on-ok)}
.barrow.ok .T{box-shadow:inset 0 0 0 3px var(--c-ok)}
.barrow.ok .T .f{background:var(--c-bar-ok)}
.barrow.ok .T span{color:var(--c-text)}
.barrow.ok .N{color:var(--c-ok)}
.legend{display:flex;gap:1.5em;color:var(--c-text-2);font-size:.9rem}
.legend i{display:inline-block;width:1.4em;height:.7em;border-radius:.2em;margin-right:.4em;vertical-align:middle}
.delta{display:flex;align-items:baseline;gap:1.2vw;margin-top:1.5vh;padding:1.2vh 1.6vw;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-lg)}
.delta b{font-size:clamp(28px,4.2vw,76px);font-weight:700;line-height:1.05;color:var(--c-accent);font-variant-numeric:tabular-nums}
.delta span{color:var(--c-text-2);font-size:clamp(14px,1.3vw,24px)}
.delta i{font-style:normal;font-weight:700;color:var(--c-ok);font-size:clamp(16px,1.6vw,30px)}

/* Gizli sonuç ve halka */
.hiddenres{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;color:var(--c-text-2);text-align:center}
.big{font-family:var(--f-display);font-size:clamp(48px,7vw,150px);font-weight:650;letter-spacing:-.02em;color:var(--c-text);line-height:1}
.ring{width:min(18vw,30vh);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c-now) calc(var(--p)*1%),var(--c-surface-2) 0)}
.ring>div{width:82%;aspect-ratio:1;border-radius:50%;background:var(--c-bg);display:grid;place-items:center;text-align:center}
.ring b{font-size:clamp(32px,4.5vw,90px);font-weight:700;line-height:1;color:var(--c-text);font-variant-numeric:tabular-nums}
.ring small{display:block;color:var(--c-text-2);font-variant-numeric:tabular-nums}

/* SCT */
.sct{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2vw;align-items:end;height:100%;min-height:30vh}
.sct .col{display:flex;flex-direction:column;align-items:center;gap:.6em;height:100%;justify-content:flex-end}
.sct .col .b{width:100%;background:var(--c-bar);border-radius:var(--r-md) var(--r-md) 0 0;transition:height .5s ease-out;min-height:4px}
.sct .col.ok .b{background:var(--c-ok)}
.sct .col.ok b{color:var(--c-ok)}
.sct .col b{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.sct .col span{text-align:center;color:var(--c-text-2);font-size:.95rem}
.sct-box{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-md);padding:.8em 1em;font-size:1.1rem}
.sct-box b{color:var(--c-accent)}

/* Kelime bulutu ve açık uçlu kartlar */
.cloud{position:relative;flex:1;min-height:0}
.cloud span{position:absolute;white-space:nowrap;font-weight:800;line-height:1;transform:translate(-50%,-50%);transition:left .4s ease-out,top .4s ease-out,font-size .4s ease-out;cursor:default;user-select:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(20em,1fr));gap:1vw;overflow:auto;overscroll-behavior:contain;align-content:start;flex:1;min-height:0;padding-right:.4em}
.cards .c{background:var(--c-surface);color:var(--c-text);border:1px solid var(--c-line);border-radius:var(--r-lg);padding:.8em 1em;font-size:1.25rem;line-height:1.35;cursor:pointer;animation:in .4s ease-out;transition:border-color .15s ease-out,background-color .15s ease-out}
.cards .c.star{grid-column:span 2;font-size:1.5rem;background:var(--c-now-soft);border-color:var(--c-now)}
.cards.mid{grid-template-columns:repeat(auto-fill,minmax(16em,1fr))}
.cards.mid .c{font-size:1.05rem;padding:.6em .8em}
.cards.many{grid-template-columns:repeat(auto-fill,minmax(13em,1fr));gap:.6vw}
.cards.many .c{font-size:.92rem;padding:.5em .7em;line-height:1.25}
.cards .c .n{display:inline-block;margin-left:.5em;background:var(--c-accent-soft);color:var(--c-accent);border:1px solid var(--c-line);border-radius:var(--r-pill);padding:.05em .55em;font-size:.8em;font-variant-numeric:tabular-nums}
.cards .pager{grid-column:1/-1;color:var(--c-text-2);font-size:.9rem;text-align:right;font-variant-numeric:tabular-nums}
@media (hover:hover){.cards .c:hover{border-color:var(--c-line-strong)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}}

/* Görselde yer bul */
.find{position:relative;height:100%;display:flex;justify-content:center}
.find .box{position:relative;height:100%;max-width:100%}
.find img{height:100%;max-width:100%;object-fit:contain;display:block;border-radius:var(--r-md);background:var(--c-img-bg);outline:1px solid var(--c-img-edge);outline-offset:-1px}
.find canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* Eşleştirme tablosu */
.grid{border-collapse:separate;border-spacing:.4vw;width:100%;table-layout:fixed}
.grid col.rh{width:28%}
.grid th{color:var(--c-text-2);font-weight:650;font-size:1.05rem;text-align:center;padding:.2em;overflow-wrap:anywhere}
.grid th.r{text-align:left;color:var(--c-text)}
.grid td{background:var(--c-surface-2);color:var(--c-text);border-radius:var(--r-sm);text-align:center;font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums;padding:clamp(.2em,.8vh,.6em) .3em;transition:background-color .4s ease-out}
.grid td.ok{outline:3px solid var(--c-ok);outline-offset:-3px}
.kpi{display:flex;gap:2vw;align-items:baseline;color:var(--c-text-2)}
.kpi b{font-size:2.2rem;font-weight:700;color:var(--c-accent);font-variant-numeric:tabular-nums}
.exp{background:var(--c-ok-soft);border-radius:var(--r-lg);padding:.6em 1.1em;font-size:clamp(18px,2.7vh,34px);line-height:1.35;color:var(--c-text);flex:0 0 auto}
.exp b{color:var(--c-ok)}

/* Oylama açıkken içerik görünümü */
.masked{display:flex;gap:2vw;align-items:flex-start;height:100%;min-height:0}
.masked>*:first-child{flex:1;min-width:0}
.mcount{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1vh;color:var(--c-text);text-align:center;font-size:1rem;font-variant-numeric:tabular-nums}
.mcount small{color:var(--c-text-2)}
.ring.sm{width:min(10vw,17vh)}
.ring.sm b{font-size:clamp(24px,2.8vw,56px)}
.mlist{display:flex;flex-direction:column;gap:1.2vh}
.mopt{display:flex;gap:.8em;align-items:center;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-md);padding:.55em .9em;font-size:clamp(16px,1.45vw,32px);font-weight:600;line-height:1.25}
.mopt .L{flex:none;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:var(--c-accent);color:var(--c-on-accent);font-weight:700}
.mopt.alt .L{background:transparent;color:var(--c-accent);box-shadow:inset 0 0 0 2px var(--c-accent)}
.mtwo{display:grid;grid-template-columns:1fr 1fr;gap:2vw}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh 1.2vw}
.mchips{display:flex;gap:1vw;flex-wrap:wrap}
.mchips span{background:var(--c-accent-soft);color:var(--c-accent);border:1px solid var(--c-accent);font-weight:700;border-radius:var(--r-pill);padding:.35em 1em;font-size:clamp(16px,1.4vw,30px)}
.mscale{display:grid;grid-template-columns:repeat(5,1fr);gap:1vw}
.mscale div{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-md);padding:.8em .4em;text-align:center;display:flex;flex-direction:column;gap:.3em;font-size:clamp(14px,1.2vw,26px)}
.mscale b{font-size:1.5em;font-weight:700;color:var(--c-accent);font-variant-numeric:tabular-nums}

/* Katılım ekranı */
.lobby{position:fixed;inset:0;background:var(--c-bg);display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center;padding:6vh 6vw;z-index:5}
.lobby .qr{height:min(70vh,44vw);aspect-ratio:1;background:var(--c-qr-bg);border-radius:var(--r-lg);padding:1.2em}
.lobby .qr svg{width:100%;height:100%;display:block}
.lobby h1{font-size:clamp(28px,3.4vw,72px);margin:0 0 .3em}
.lobby .url{font-size:clamp(16px,1.7vw,34px);color:var(--c-text-2);font-weight:500}
.lobby .code{font-size:clamp(60px,9vw,190px);font-weight:800;letter-spacing:.12em;font-variant-numeric:tabular-nums;color:var(--c-text);line-height:1.05}
.lobby .count{font-size:clamp(18px,2vw,40px);margin-top:.6em;color:var(--c-text-2)}
.lobby .count b{color:var(--c-text);font-variant-numeric:tabular-nums}
.lobby.withslide{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:3vw;padding:4vh 4vw}
.lobby .sl{width:100%;max-height:90vh;object-fit:contain;border-radius:var(--r-lg);background:var(--c-letterbox);outline:1px solid var(--c-img-edge);outline-offset:-1px}
.lobby.withslide .qr{height:min(36vh,20vw);margin-bottom:1.5vh}
.lobby.withslide .code{font-size:clamp(44px,6vw,130px)}
.lobby.withslide .url{font-size:clamp(14px,1.3vw,26px)}
.lobby.withslide .count{font-size:clamp(16px,1.7vw,32px)}
.nicks{display:flex;flex-wrap:wrap;gap:.5em;margin-top:1.2em;max-height:24vh;overflow:hidden}
.nicks span{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-pill);padding:.3em .9em;font-weight:600;color:var(--c-text)}

/* Liderlik */
.lboard{display:flex;flex-direction:column;gap:.7vh;max-width:60em;width:100%;margin:0 auto;min-height:0}
.lboard .rows{display:flex;flex-direction:column;gap:.7vh}
.lboard .r{display:grid;grid-template-columns:3em 1fr auto;align-items:center;gap:1em;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-md);padding:.35em 1em;font-size:clamp(15px,min(1.35vw,2.6vh),30px);animation:in .5s ease-out both}
.lboard .r>b:first-child{color:var(--c-text-2)}
.lboard .r:nth-child(1){background:var(--c-accent);border-color:var(--c-accent);color:var(--c-on-accent);font-weight:700}
.lboard .r:nth-child(1)>b:first-child{color:inherit}
.lboard .r:nth-child(2),.lboard .r:nth-child(3){background:var(--c-surface-2);border-color:var(--c-accent)}
.lboard .r b{font-variant-numeric:tabular-nums}

/* Alt kontrol bandı */
.ctrl{position:relative;z-index:3;display:flex;flex-wrap:wrap;gap:.5em;align-items:center;justify-content:center;padding:1vh 2vw 1.6vh;transition:opacity .3s ease-out}
.ctrl.idle{opacity:0}
.ctrl button{min-height:2.4em;background:var(--c-surface-2);border:1px solid transparent;border-radius:var(--r-md);padding:.5em .9em;font-weight:650;font-size:.9rem;transition-property:background-color,border-color,color,scale;transition-duration:150ms;transition-timing-function:ease-out}
.ctrl button:active{scale:.96}
.ctrl button kbd{font-family:var(--f-body);font-size:.75rem;font-weight:600;color:var(--c-text-2);margin-left:.5em;padding:.05em .4em;border:1px solid var(--c-line-strong);border-radius:.3em}
.ctrl button.on{background:var(--c-accent-soft);border-color:var(--c-accent);color:var(--c-accent)}
.ctrl button.on kbd{color:var(--c-accent);border-color:var(--c-accent)}
@media (hover:hover){.ctrl button:not(.on):hover{border-color:var(--c-line-strong)}}
.phase{font-weight:700;padding:.4em .8em;border-radius:var(--r-pill);font-size:.95rem;letter-spacing:.02em;background:var(--c-surface-2);color:var(--c-text-2)}
.phase.ph-open{background:var(--c-now);color:var(--c-on-now)}
.phase.ph-closed{background:var(--c-surface-2);color:var(--c-text);box-shadow:inset 0 0 0 1px var(--c-line-strong)}
.phase.board,.phase.end,.phase.ph-lobby,.phase.ph-board,.phase.ph-end{background:var(--c-surface-2);color:var(--c-text-2)}
.phase.ph-reveal{background:var(--c-ok-soft);color:var(--c-ok)}

/* Slayt katmanı */
.slide{position:absolute;inset:0;background:var(--c-letterbox);z-index:2;display:grid;place-items:center}
.slide img{width:100%;height:100%;object-fit:contain;display:block}
.badge{position:absolute;top:1.5vh;right:1.2vw;display:flex;gap:.6em;align-items:center;background:var(--c-badge-bg);border:1px solid var(--c-line);border-radius:var(--r-lg);padding:.45em .6em;box-shadow:var(--shadow-2)}
.badge .qr{width:min(6vw,10vh);aspect-ratio:1;background:var(--c-qr-bg);border-radius:.3em;padding:.2em}
.badge .qr svg{width:100%;height:100%;display:block}
.badge b{display:block;font-size:1.5rem;font-weight:700;letter-spacing:.1em;font-variant-numeric:tabular-nums;color:var(--c-text)}
.badge small{color:var(--c-text-2);font-variant-numeric:tabular-nums}

/* Başlangıç ve eşleştirme */
.start{position:fixed;inset:0;overflow:auto;overscroll-behavior:contain;padding:6vh 6vw;background:var(--c-bg);z-index:6}
.start>*+*{margin-top:1.2vh}
.start h1{font-size:clamp(28px,3vw,60px)}
.start p{color:var(--c-text-2);max-width:70ch}
.start p b{color:var(--c-text)}
.pair{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-lg);padding:1.4em;margin-top:3vh;max-width:52em;display:flex;flex-direction:column;gap:.8em}
.pair h2{font-size:1.5rem}
.pair label{display:flex;flex-direction:column;gap:.3em;color:var(--c-text-2);font-weight:650}
input.pin{font-size:1.8rem;font-weight:700;letter-spacing:.2em;font-variant-numeric:tabular-nums;min-height:2.4em;padding:.35em .6em;border-radius:var(--r-md);border:1px solid var(--c-line-strong);background:var(--c-bg);color:var(--c-text);width:9em;text-transform:uppercase;transition:border-color .15s ease-out}
input.pin::placeholder{color:var(--c-text-2);opacity:.6}
input.pin:focus{border-color:var(--c-accent)}
input.pin[type=password]{text-transform:none;letter-spacing:.1em}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(22em,1fr));gap:1.5vw;margin-top:3vh}
.lessons .l{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-lg);padding:1.2em;display:flex;flex-direction:column;gap:.8em}
.lessons .l h2{font-size:1.4rem}
.lessons .l small{color:var(--c-text-2);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.4em;background:var(--c-accent);color:var(--c-on-accent);border:1px solid transparent;border-radius:var(--r-md);padding:.6em 1.1em;font-weight:650;line-height:1.2;transition-property:background-color,border-color,color,scale;transition-duration:150ms;transition-timing-function:ease-out}
.btn:not(:disabled):active{scale:.96}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--c-text);border-color:var(--c-line-strong)}
@media (hover:hover){
  .btn:not(:disabled):hover{background:color-mix(in oklab,var(--c-accent) 88%,var(--c-text))}
  .btn.ghost:not(:disabled):hover{background:var(--c-surface-2);border-color:var(--c-accent)}
}
.err{color:var(--c-bad);font-weight:600}
.fresh,#start .fresh{background:var(--c-now-soft);color:var(--c-text)!important;border:1px solid var(--c-now);font-weight:650;border-radius:var(--r-md);padding:.6em .9em;display:inline-block}

/* Bitiş */
.endv{flex:1;display:flex;align-items:center;justify-content:center;gap:5vw;padding:4vh 4vw}
.endv .qr{width:min(30vw,52vh);aspect-ratio:1;background:var(--c-qr-bg);padding:2.2vh;border-radius:var(--r-lg)}
.endv .qr svg{width:100%;height:100%;display:block}
.endv p{font-size:clamp(18px,1.9vw,34px);color:var(--c-text-2);margin:2vh 0 0;max-width:34vw;text-wrap:pretty}
.endv .endsum{color:var(--c-text);font-weight:650;font-variant-numeric:tabular-nums}
.endv .url{color:var(--c-text-2);font-size:clamp(14px,1.3vw,24px);font-weight:500}
.endv .cta{background:var(--c-surface);border:1px solid var(--c-line);color:var(--c-text);font-weight:650;border-radius:var(--r-lg);padding:1.2vh 1.6vw}
.endv .newpair{margin-top:3vh;font-size:clamp(14px,1.1vw,22px)}

/* Yüzen katmanlar (gölge yalnız burada) */
.pbNotice{position:fixed;top:4vh;left:50%;transform:translateX(-50%);z-index:35;background:var(--c-text);color:var(--c-bg);font-size:3.4vh;line-height:1.3;font-weight:700;padding:1.8vh 3vw;border-radius:var(--r-lg);box-shadow:var(--shadow-2);max-width:84vw;text-align:center;text-wrap:balance;cursor:pointer}
.flash{position:fixed;inset:0;z-index:30;background:var(--c-ok);color:var(--c-on-ok);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;transition:opacity .5s ease-out}
.flash.out{opacity:0}
.flash .ok{width:22vh;height:22vh;border-radius:50%;background:var(--c-bg);color:var(--c-ok);font-size:14vh;font-weight:700;line-height:1;display:grid;place-items:center}
.flash b{font-family:var(--f-display);font-weight:650;font-size:6vh}
.flash span{font-size:2.6vh;font-weight:600}
.waitr{position:fixed;inset:0;z-index:6;background:var(--c-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;padding:6vh 8vw;cursor:pointer}
.waitr .code{font-size:clamp(60px,12vw,220px);font-weight:800;letter-spacing:.12em;font-variant-numeric:tabular-nums;color:var(--c-text);line-height:1.05}
.waitr h1{font-size:clamp(28px,4vw,72px)}
.waitr p{font-size:clamp(16px,2vw,34px);max-width:60ch;color:var(--c-text-2)}
.waitr p b{color:var(--c-text)}
.waitr .muted{color:var(--c-text-2);font-size:clamp(14px,1.5vw,26px)}
.muted{color:var(--c-text-2)}
.toast{position:fixed;left:50%;bottom:9vh;transform:translateX(-50%);z-index:9;background:var(--c-bad);color:var(--c-on-bad);padding:.7em 1.2em;border-radius:var(--r-md);font-weight:700;box-shadow:var(--shadow-2)}
</style>
</head>
<body>
<div id="start" class="start"></div>
<div id="stage" class="hidden">
  <header class="topbar">
    <span class="chip" id="chip">CANLI</span>
    <span class="lbl" id="lbl"></span>
    <span class="prog" id="prog"></span>
    <span class="timer hidden" id="timer"></span>
    <div class="stat"><b id="nAns">0</b><small>cevap</small></div>
    <div class="stat"><b id="nJoin">0</b><small>katılımcı</small></div>
    <div class="join" id="joinMini"><div class="qr" id="qrMini"></div><div class="u"><small id="urlMini"></small><b id="codeMini">----</b></div></div>
  </header>
  <main id="main"></main>
  <div id="slide" class="slide hidden"><img id="slideImg" alt=""><div id="badge" class="badge hidden"><div class="qr"></div><div><b></b><small></small></div></div></div>
  <footer class="ctrl" id="ctrl"></footer>
</div>
<div id="lobby" class="lobby hidden"></div>

<script src="perde.js?v=1760003200"></script>
