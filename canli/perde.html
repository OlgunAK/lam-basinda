<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lam Başında Canlı · Perde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Perde: sunumdaki koyu "aksiyon" slaytlarıyla aynı zemin. Ölçüler vw/vh ile, projektörde de dizüstünde de aynı oran. */
:root{
  --bg:#24163A; --panel:#2F2149; --panel2:#3A2C55; --ink:#FFFFFF; --soft:#E9DDF6; --muted:#B7A6CC;
  --dus:#F2B705; --eosin:#E2558A; --hema:#7B5BB5; --ok:#3FD49A; --bad:#FF7A70; --pink:#FBE9F0;
  --f-display:"Literata",Georgia,serif;
  --f-body:"Figtree",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{font-size:clamp(16px,1.05vw,26px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;font-size:clamp(14px,1.15vw,22px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--dus);outline-offset:2px}
.hidden{display:none!important}
#stage{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}
/* üst bant */
.topbar{display:flex;align-items:center;gap:1.2vw;padding:1.6vh 2.2vw 0}
.chip{background:var(--dus);color:var(--bg);font-weight:800;border-radius:.5em;padding:.35em .8em;font-size:1rem;white-space:nowrap}
.lbl{font-weight:700;color:var(--soft);font-size:1.05rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{font-family:var(--f-mono);color:var(--muted)}
.join{display:flex;align-items:center;gap:.8vw;background:var(--panel);border-radius:.8em;padding:.5em .8em}
.join .qr{width:min(7vw,12vh);aspect-ratio:1;background:#fff;border-radius:.4em;padding:.25em}
.join .qr svg,.join .qr img{width:100%;height:100%;display:block}
.join .u{display:flex;flex-direction:column;line-height:1.2}
.join .u small{color:var(--muted);font-size:.8rem}
.join .u b{font-family:var(--f-mono);font-size:1.6rem;letter-spacing:.12em;color:var(--dus)}
.stat{display:flex;flex-direction:column;align-items:center;min-width:4.5em}
.stat b{font-family:var(--f-mono);font-size:1.7rem;line-height:1}
.stat small{color:var(--muted);font-size:.75rem}
/* ana alan */
main{min-height:0;overflow:hidden;padding:2vh 2.2vw 1vh;display:flex;flex-direction:column;gap:2vh}
.q{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.1vw,46px);line-height:1.25;max-width:70em;text-wrap:balance}
.q.long{font-size:clamp(18px,1.7vw,36px)}
.viz{flex:1;min-height:0;display:flex;gap:2vw}
.viz .side{flex:0 0 auto;max-width:38%;display:flex;align-items:flex-start}
.viz .side img{max-width:100%;max-height:100%;border-radius:.6em;object-fit:contain;background:#fff}
.viz .res{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:1.2vh;justify-content:safe center}
.bars{display:flex;flex-direction:column;gap:1.3vh}
.barrow{display:grid;grid-template-columns:2.2em 1fr 7.5em;align-items:center;gap:.8em}
.barrow .L{width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:var(--hema);font-weight:800}
.barrow .T{position:relative;background:var(--panel2);border-radius:.5em;min-height:3em;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.barrow .T .f{position:absolute;inset:0 auto 0 0;background:var(--hema);transition:width .5s ease}
.barrow .T .f.g{background:rgba(251,233,240,.8);top:auto;bottom:0;height:22%}
.barrow .T span{position:relative;padding:.35em .9em;font-weight:700;font-size:1.45rem}
.barrow .N{font-family:var(--f-mono);text-align:right;font-weight:700;font-size:1.45rem}
.barrow .N small{display:block;color:var(--muted);font-weight:500;font-size:.75rem}
.barrow.ok .L{background:var(--ok);color:var(--bg)}
.barrow.ok .T{box-shadow:inset 0 0 0 3px var(--ok)}
.barrow.ok .T .f{background:#17744E}
.barrow.ok .T span{color:#fff}
.legend{display:flex;gap:1.5em;color:var(--muted);font-size:.9rem}
.legend i{display:inline-block;width:1.4em;height:.7em;border-radius:.2em;margin-right:.4em;vertical-align:middle}
.endv{flex:1;display:flex;align-items:center;justify-content:center;gap:5vw;padding:4vh 4vw}
.endv .qr{width:min(30vw,52vh);aspect-ratio:1;background:#fff;padding:2.2vh;border-radius:2vh}
.endv .qr svg{width:100%;height:100%;display:block}
.endv p{font-size:clamp(18px,1.9vw,34px);color:var(--soft);margin:2vh 0 0;max-width:34vw}
.endv .endsum{font-family:var(--f-mono);color:var(--dus);font-weight:700}
.endv .url{font-family:var(--f-mono);color:var(--muted)}
.hiddenres{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;color:var(--muted)}
.big{font-family:var(--f-mono);font-size:clamp(48px,9vw,180px);font-weight:800;color:var(--ink);line-height:1}
.ring{width:min(18vw,30vh);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--dus) calc(var(--p)*1%),var(--panel2) 0)}
.ring>div{width:82%;aspect-ratio:1;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--f-mono);font-size:clamp(32px,4.5vw,90px)}
.ring small{display:block;color:var(--muted)}
.sct{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2vw;align-items:end;height:100%;min-height:30vh}
.sct .col{display:flex;flex-direction:column;align-items:center;gap:.6em;height:100%;justify-content:flex-end}
.sct .col .b{width:100%;background:var(--hema);border-radius:.5em .5em 0 0;transition:height .5s;min-height:4px}
.sct .col.ok .b{background:var(--ok)}
.sct .col b{font-family:var(--f-mono);font-size:1.4rem}
.sct .col span{text-align:center;color:var(--soft);font-size:.95rem}
.sct-box{background:var(--panel2);border-radius:.6em;padding:.8em 1em;font-size:1.1rem}
.sct-box b{color:var(--dus)}
.cloud{position:relative;flex:1;min-height:0}
.cloud span{position:absolute;white-space:nowrap;font-weight:800;line-height:1;transform:translate(-50%,-50%);transition:left .4s,top .4s,font-size .4s;cursor:default;user-select:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(20em,1fr));gap:1vw;overflow:auto;align-content:start;flex:1;min-height:0;padding-right:.4em}
.cards .c{background:var(--pink);color:#24163A;border-radius:.7em;padding:.8em 1em;font-size:1.25rem;line-height:1.35;cursor:pointer;animation:in .4s ease}
.cards .c.star{grid-column:span 2;font-size:1.5rem;background:var(--dus)}.cards.mid{grid-template-columns:repeat(auto-fill,minmax(16em,1fr))}.cards.mid .c{font-size:1.05rem;padding:.6em .8em}.cards.many{grid-template-columns:repeat(auto-fill,minmax(13em,1fr));gap:.6vw}.cards.many .c{font-size:.92rem;padding:.5em .7em;line-height:1.25}.cards .c .n{display:inline-block;margin-left:.5em;background:#24163A;color:#fff;border-radius:1em;padding:.05em .55em;font-size:.8em}.cards .pager{grid-column:1/-1;color:var(--muted);font-size:.9rem;text-align:right}.delta{display:flex;align-items:baseline;gap:1.2vw;margin-top:1.5vh;padding:1.2vh 1.6vw;background:rgba(255,255,255,.06);border-radius:1vh}.delta b{font-family:var(--f-mono);font-size:clamp(28px,4.2vw,76px);color:var(--dus)}.delta span{color:var(--soft);font-size:clamp(14px,1.3vw,24px)}.delta i{font-style:normal;font-weight:700;color:var(--ok,#3FD49A);font-size:clamp(16px,1.6vw,30px)}.endv .cta{background:var(--dus);color:#24163A;font-weight:700;border-radius:1vh;padding:1.2vh 1.6vw}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.find{position:relative;height:100%;display:flex;justify-content:center}
.find .box{position:relative;height:100%;max-width:100%}
.find img{height:100%;max-width:100%;object-fit:contain;display:block;border-radius:.6em;background:#fff}
.find canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.grid{border-collapse:separate;border-spacing:.4vw;width:100%;table-layout:fixed}
.grid col.rh{width:28%}
.grid th{color:var(--soft);font-weight:700;font-size:1.05rem;text-align:center;padding:.2em;overflow-wrap:anywhere}
.grid th.r{text-align:left}
.grid td{background:var(--panel2);border-radius:.4em;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:1.3rem;padding:clamp(.2em,.8vh,.6em) .3em;transition:background .4s}
.grid td.ok{outline:3px solid var(--ok);outline-offset:-3px}
.kpi{display:flex;gap:2vw;align-items:baseline;color:var(--soft)}
.kpi b{font-family:var(--f-mono);font-size:2.2rem;color:var(--dus)}
.exp{background:var(--panel);border-left:.35em solid var(--ok);border-radius:.4em;padding:.6em 1.1em;font-size:clamp(18px,2.7vh,34px);line-height:1.35;color:var(--ink);flex:0 0 auto}
.exp b{color:var(--ok)}
/* oylama açıkken içerik görünümü */
.masked{display:flex;gap:2vw;align-items:flex-start;height:100%;min-height:0}
.masked>*:first-child{flex:1;min-width:0}
.mcount{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1vh;color:var(--soft);text-align:center;font-size:1rem}
.mcount small{color:var(--muted)}
.ring.sm{width:min(10vw,17vh)}
.ring.sm b{font-size:clamp(24px,2.8vw,56px)}
.mlist{display:flex;flex-direction:column;gap:1.2vh}
.mopt{display:flex;gap:.8em;align-items:center;background:var(--panel2);border-radius:.6em;padding:.55em .9em;font-size:clamp(16px,1.45vw,32px);font-weight:600;line-height:1.25}
.mopt .L{flex:none;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:var(--hema);font-weight:800}
.mopt.alt .L{background:var(--eosin)}
.mtwo{display:grid;grid-template-columns:1fr 1fr;gap:2vw}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh 1.2vw}
.mchips{display:flex;gap:1vw;flex-wrap:wrap}
.mchips span{background:var(--dus);color:var(--bg);font-weight:800;border-radius:2em;padding:.35em 1em;font-size:clamp(16px,1.4vw,30px)}
.mscale{display:grid;grid-template-columns:repeat(5,1fr);gap:1vw}
.mscale div{background:var(--panel2);border-radius:.6em;padding:.8em .4em;text-align:center;display:flex;flex-direction:column;gap:.3em;font-size:clamp(14px,1.2vw,26px)}
.mscale b{font-family:var(--f-mono);font-size:1.5em}
/* katılım ekranı */
.lobby{position:fixed;inset:0;background:var(--bg);display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center;padding:6vh 6vw;z-index:5}
.lobby .qr{height:min(70vh,44vw);aspect-ratio:1;background:#fff;border-radius:1.2em;padding:1.2em}
.lobby .qr svg{width:100%;height:100%;display:block}
.lobby h1{font-family:var(--f-display);font-size:clamp(28px,3.4vw,72px);margin:0 0 .3em}
.lobby .url{font-family:var(--f-mono);font-size:clamp(16px,1.7vw,34px);color:var(--soft)}
.lobby .code{font-family:var(--f-mono);font-size:clamp(60px,9vw,190px);font-weight:800;letter-spacing:.12em;color:var(--dus);line-height:1.05}
.lobby .count{font-size:clamp(18px,2vw,40px);margin-top:.6em}
.lobby .count b{font-family:var(--f-mono);color:var(--ok)}
.lobby.withslide{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:3vw;padding:4vh 4vw}.lobby .sl{width:100%;max-height:90vh;object-fit:contain;border-radius:1vh;box-shadow:0 1vh 4vh rgba(0,0,0,.45);background:#000}.lobby.withslide .qr{height:min(36vh,20vw);margin-bottom:1.5vh}.lobby.withslide .code{font-size:clamp(44px,6vw,130px)}.lobby.withslide .url{font-size:clamp(14px,1.3vw,26px)}.lobby.withslide .count{font-size:clamp(16px,1.7vw,32px)}
.nicks{display:flex;flex-wrap:wrap;gap:.5em;margin-top:1.2em;max-height:24vh;overflow:hidden}
.nicks span{background:var(--panel2);border-radius:2em;padding:.3em .9em;font-weight:600;color:var(--ink)}
/* liderlik */
.lboard{display:flex;flex-direction:column;gap:.7vh;max-width:60em;width:100%;margin:0 auto;min-height:0}
.lboard .rows{display:flex;flex-direction:column;gap:.7vh}
.lboard .r{display:grid;grid-template-columns:3em 1fr auto;align-items:center;gap:1em;background:var(--panel2);border-radius:.6em;padding:.35em 1em;font-size:clamp(15px,min(1.35vw,2.6vh),30px);animation:in .5s ease both}
.lboard .r:nth-child(1){background:var(--dus);color:var(--bg);font-weight:800}
.lboard .r:nth-child(2),.lboard .r:nth-child(3){background:var(--hema)}
.lboard .r b{font-family:var(--f-mono)}
/* alt kontrol bandı */
.ctrl{display:flex;flex-wrap:wrap;gap:.5em;align-items:center;justify-content:center;padding:1vh 2vw 1.6vh;transition:opacity .3s}
.ctrl.idle{opacity:0}
.ctrl button{background:var(--panel2);border:0;border-radius:.5em;padding:.5em .9em;font-weight:700;font-size:.9rem}
.ctrl button kbd{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);margin-left:.4em}
.ctrl button.on{background:var(--dus);color:var(--bg)}
.ctrl button.on kbd{color:var(--bg)}
.phase{font-family:var(--f-mono);font-weight:800;padding:.4em .8em;border-radius:.5em;font-size:.95rem}
.phase.ph-open{background:var(--ok);color:var(--bg)}
.phase.ph-closed{background:var(--bad);color:var(--bg)}
.phase.board,.phase.end,.phase.ph-lobby{background:var(--panel2)}
.phase.ph-reveal{background:var(--dus);color:var(--bg)}
.timer{font-family:var(--f-mono);font-weight:800;font-size:1.6rem;color:var(--dus)}
/* slayt katmanı */
.slide{position:absolute;inset:0;background:#000;z-index:2;display:grid;place-items:center}
.slide img{width:100%;height:100%;object-fit:contain;display:block}
.badge{position:absolute;top:1.5vh;right:1.2vw;display:flex;gap:.6em;align-items:center;background:rgba(36,22,58,.92);border-radius:.7em;padding:.45em .6em}
.badge .qr{width:min(6vw,10vh);aspect-ratio:1;background:#fff;border-radius:.3em;padding:.2em}
.badge .qr svg{width:100%;height:100%;display:block}
.badge b{display:block;font-family:var(--f-mono);font-size:1.5rem;color:var(--dus);letter-spacing:.1em}
.badge small{color:var(--soft)}
.ctrl{position:relative;z-index:3}
.pair{background:var(--panel);border-radius:.9em;padding:1.4em;margin-top:3vh;max-width:52em;display:flex;flex-direction:column;gap:.8em}
.pair h2{font-family:var(--f-display);margin:0}
.pair label{display:flex;flex-direction:column;gap:.3em;color:var(--soft);font-weight:700}
input.pin{font-family:var(--f-mono);font-size:1.8rem;letter-spacing:.2em;padding:.4em .6em;border-radius:.5em;border:2px solid var(--panel2);background:var(--bg);color:var(--ink);width:9em;text-transform:uppercase}
/* başlangıç */
.start{position:fixed;inset:0;overflow:auto;padding:6vh 6vw;background:var(--bg);z-index:6}
.start h1{font-family:var(--f-display);font-size:clamp(28px,3vw,60px);margin:0}
.start p{color:var(--soft)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(22em,1fr));gap:1.5vw;margin-top:3vh}
.lessons .l{background:var(--panel);border-radius:.9em;padding:1.2em;display:flex;flex-direction:column;gap:.8em}
.lessons .l h2{font-family:var(--f-display);margin:0;font-size:1.4rem}
.lessons .l small{color:var(--muted)}
.btn{background:var(--dus);color:var(--bg);border:0;border-radius:.6em;padding:.7em 1.1em;font-weight:800}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--panel2)}
.err{color:var(--bad)}
.pbNotice{position:fixed;top:4vh;left:50%;transform:translateX(-50%);z-index:35;background:#fff;color:#1b0f2e;font-size:3.4vh;line-height:1.3;font-weight:700;padding:1.8vh 3vw;border-radius:1.6vh;box-shadow:0 1vh 4vh rgba(0,0,0,.45);max-width:84vw;text-align:center;cursor:pointer}
.flash{position:fixed;inset:0;z-index:30;background:rgba(23,116,78,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;color:#fff;transition:opacity .5s}
.flash.out{opacity:0}
.waitr{position:fixed;inset:0;z-index:6;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;padding:6vh 8vw;cursor:pointer}.waitr .code{font-family:var(--f-mono);font-size:clamp(60px,12vw,220px);font-weight:800;letter-spacing:.12em;color:var(--dus);line-height:1.05}.waitr h1{font-family:var(--f-display);font-size:clamp(28px,4vw,72px);margin:0}.waitr p{font-size:clamp(16px,2vw,34px);max-width:60ch;margin:0}.waitr .muted{color:var(--muted);font-size:clamp(14px,1.5vw,26px)}
.flash .ok{width:22vh;height:22vh;border-radius:50%;background:#fff;color:#17744E;font-size:15vh;font-weight:800;display:grid;place-items:center}
.flash b{font-family:var(--f-display);font-size:6vh}
.flash span{font-size:2.6vh;opacity:.9}
.fresh,#start .fresh{background:var(--dus);color:#24163A !important;font-weight:700;border-radius:.5em;padding:.6em .9em;display:inline-block}
.endv .newpair{margin-top:3vh;font-size:clamp(14px,1.1vw,22px)}
.toast{position:fixed;left:50%;bottom:9vh;transform:translateX(-50%);background:var(--bad);color:var(--bg);padding:.7em 1.2em;border-radius:.6em;font-weight:700;z-index:9}
</style>
</head>
<body>
<div id="start" class="start"></div>
<div id="stage" class="hidden">
  <header class="topbar">
    <span class="chip" id="chip">CANLI</span>
    <span class="lbl" id="lbl"></span>
    <span class="prog" id="prog"></span>
    <span class="timer hidden" id="timer"></span>
    <div class="stat"><b id="nAns">0</b><small>cevap</small></div>
    <div class="stat"><b id="nJoin">0</b><small>katılımcı</small></div>
    <div class="join" id="joinMini"><div class="qr" id="qrMini"></div><div class="u"><small id="urlMini"></small><b id="codeMini">----</b></div></div>
  </header>
  <main id="main"></main>
  <div id="slide" class="slide hidden"><img id="slideImg" alt=""><div id="badge" class="badge hidden"><div class="qr"></div><div><b></b><small></small></div></div></div>
  <footer class="ctrl" id="ctrl"></footer>
</div>
<div id="lobby" class="lobby hidden"></div>
<script>window.__V="1760003000"</script><script src="config.js?v=1760003000"></script>
<script src="perde.js?v=1760003000"></script>
</body>
</html>
