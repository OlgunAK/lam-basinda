<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#24163A">
<title>Lam Başında Canlı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Öğrenci ekranı: telefon öncelikli, tek sütun. Lam Başında ile aynı H&E paleti. */
:root{
  --bg:#FBF8FC; --card:#FFFFFF; --ink:#24163A; --muted:#6B5D7B; --line:#E6DCEE;
  --hema:#4A2C82; --hema-soft:#EFE8FA; --eosin:#C2366A; --eosin-soft:#FBE9F0;
  --ok:#17744E; --ok-soft:#E3F4EC; --bad:#B02E2A; --bad-soft:#FBE7E6; --dus:#F2B705;
  --f-display:"Literata",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150E1E; --card:#20172C; --ink:#F2EBF7; --muted:#A898B9; --line:#382A49;
  --hema:#B9A0EE; --hema-soft:#2C2142; --eosin:#F27CA3; --eosin-soft:#3A1E2C;
  --ok:#55C792; --ok-soft:#173327; --bad:#F3776F; --bad-soft:#3B1C1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150E1E; --card:#20172C; --ink:#F2EBF7; --muted:#A898B9; --line:#382A49;
  --hema:#B9A0EE; --hema-soft:#2C2142; --eosin:#F27CA3; --eosin-soft:#3A1E2C;
  --ok:#55C792; --ok-soft:#173327; --bad:#F3776F; --bad-soft:#3B1C1B; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100dvh}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hema);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--eosin) 0 22%,transparent 23%),radial-gradient(circle at 66% 60%,var(--hema) 0 16%,transparent 17%),radial-gradient(circle at 40% 72%,var(--hema) 0 10%,transparent 11%),var(--eosin-soft);border:2px solid var(--line)}
.top .t{flex:1;min-width:0}
.top .t b{display:block;font-family:var(--f-display);font-size:1.05rem;line-height:1.2}
.top .t span{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-family:var(--f-mono);font-size:.78rem;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--hema-soft);color:var(--hema);flex:none}
.net{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.net.off{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.95rem}
label.f small{font-weight:400;color:var(--muted)}
input.in,textarea.in,select.in{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
input.code{font-family:var(--f-mono);font-size:1.6rem;letter-spacing:.3em;text-align:center}
textarea.in{min-height:120px;resize:vertical}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:1.02rem;background:var(--hema);color:var(--bg);width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:600}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--eosin);font-weight:700}
.qtext{font-family:var(--f-display);font-size:1.18rem;font-weight:700;line-height:1.3}
.qimg{width:100%;border-radius:10px;display:block;border:1px solid var(--line);background:#fff}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
.opt .l{font-family:var(--f-mono);font-weight:700;color:var(--hema);flex:none;width:1.2em}
.opt.sel{border-color:var(--hema);background:var(--hema-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.sct-info{background:var(--hema-soft);border-radius:10px;padding:12px}
.sct-info b{color:var(--eosin)}
.scale{display:flex;flex-direction:column;gap:6px}
.scale .opt{align-items:center;padding:11px 14px}
.scale .opt b{font-family:var(--f-mono);font-size:1.1rem;width:2.2em;flex:none;color:var(--hema)}
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--hema-soft);font-weight:600}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.ntoast{position:fixed;top:12px;left:12px;right:12px;z-index:12;background:var(--ink,#1b0f2e);color:#fff;padding:14px 16px;border-radius:12px;font-size:1.05rem;line-height:1.35;box-shadow:0 8px 30px rgba(0,0,0,.35);cursor:pointer}.ntoast b{color:#ffd166}
.mir{position:relative;border-radius:var(--r);overflow:hidden;background:#000;border:1px solid var(--line);cursor:pointer}.mir img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#fff}.mir .mcap{display:flex;gap:8px;align-items:baseline;padding:8px 12px;background:var(--card);color:var(--ink);font-size:.85rem}.mir .mcap span{font-family:var(--f-mono);color:var(--muted)}.mir .mcap b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.mir .mcap small{color:var(--muted)}.mir.small{margin-bottom:4px}.mir.small .mcap{padding:4px 10px;font-size:.75rem}.mir.full{position:fixed;inset:0;z-index:20;border:0;border-radius:0;display:flex;align-items:center;justify-content:center}.mir.full img{aspect-ratio:auto;background:#000}.mir.full .mcap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff}.mir.full .mcap span,.mir.full .mcap small{color:#ddd}@media (orientation:portrait){.mir.full img{width:100vh;height:100vw;max-width:none;transform:rotate(90deg);object-fit:contain}.mir.full .mcap{display:none}}.ansbar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--ok-soft);color:var(--ok)}.ansbar span{flex:1;display:flex;flex-direction:column}.ansbar small{font-size:.75rem;opacity:.8}.ansbar b{font-size:1.05rem}.ansbar .btn.sm{width:auto;padding:8px 12px;font-size:.9rem;color:var(--ok);border-color:var(--ok)}
.dsheet{position:fixed;inset:0;z-index:9;background:rgba(20,10,40,.55);display:flex;align-items:flex-end;justify-content:center}.dsheet .in{background:var(--panel,#fff);color:var(--ink);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}.dsheet h2{margin:0;font-family:var(--f-display)}.dsheet .krow{display:flex;gap:10px}.dsheet .krow div{flex:1;background:var(--hema-soft);border-radius:12px;padding:10px;text-align:center}.dsheet .krow b{display:block;font-family:var(--f-mono);font-size:1.4rem}.dsheet .krow small{color:var(--muted)}.dsheet .lb .r{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px}.dsheet .lb .r.me{background:var(--ok-soft);color:var(--ok)}.dsheet .lb .r span{flex:1}.dsheet .eyebrow{margin:0 0 4px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#codepill{cursor:pointer}#mirbtn.off{background:var(--line);color:var(--muted)}#skorbtn{border:0;background:var(--dus);color:var(--bg);cursor:pointer}
.nxcard{background:var(--hema-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;margin:6px 0}.nxcard p{margin:0;font-weight:600}
.nxbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:8;background:var(--dus);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.35)}.nxbar button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;background:var(--bg);color:var(--dus)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.status.wait{background:var(--eosin-soft);color:var(--eosin)}
.exp{color:var(--ink);font-size:.95rem;border-left:3px solid var(--eosin);padding-left:12px}
.findscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
.find{position:relative;touch-action:manipulation}
.find.wide{width:190%}
.find img{width:100%;display:block;border-radius:10px;border:1px solid var(--line)}
.dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #fff;background:var(--eosin);box-shadow:0 0 0 2px var(--eosin),0 2px 8px rgba(0,0,0,.35);pointer-events:none}
.region{position:absolute;border:3px dashed var(--ok);background:rgba(23,116,78,.18);pointer-events:none}
.region.ell{border-radius:50%}.region.hole{background:rgba(255,255,255,.35);border-style:dotted}
.row{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row .it{font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;padding:10px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:.88rem;font-weight:600}
.seg button.sel{border-color:var(--hema);background:var(--hema);color:var(--bg)}
.seg button.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.seg button.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.order .opt .l{width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;background:var(--hema-soft);font-size:.85rem}
.order .opt.sel .l{background:var(--hema);color:var(--bg)}
.wait{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:36px 12px}
.pulse{width:64px;height:64px;border-radius:50%;background:var(--eosin-soft);position:relative}
.pulse::after{content:"";position:absolute;inset:18px;border-radius:50%;background:var(--eosin);animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{transform:scale(.6);opacity:.6}}
@media (prefers-reduced-motion:reduce){.pulse::after{animation:none}}
.muted{color:var(--muted);font-size:.9rem}
.score{font-family:var(--f-display);font-size:2.4rem;font-weight:700;color:var(--hema)}
a{color:var(--hema)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark" aria-hidden="true"></div>
    <div class="t"><b>Lam Başında Canlı</b><span id="sub">4. Sınıf Patoloji</span></div>
    <span class="pill hidden" id="codepill"></span>
    <button class="pill hidden" id="mirbtn" type="button">Perde</button>
    <button class="pill hidden" id="adbtn" type="button">Ad ekle</button>
    <button class="pill hidden" id="skorbtn" type="button">Skor</button>
    <span class="net" id="net" title="Bağlantı"></span>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<script>window.__V="1760002400"</script><script src="config.js?v=1760002400"></script>
<script src="ogrenci.js?v=1760002400"></script>
</body>
</html>
