<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#24163A">
<title>Lam Başında Canlı · Kumanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Kumanda: sunucunun telefonu. Koyu zemin (sınıfta göz almasın), büyük ileri/geri, notlar ortada. */
:root{
  --bg:#1A1029; --panel:#24163A; --panel2:#3A2C55; --ink:#FFFFFF; --soft:#E9DDF6; --muted:#A898B9;
  --dus:#F2B705; --eosin:#E2558A; --hema:#7B5BB5; --ok:#3FD49A; --bad:#FF7A70;
  --f-display:"Literata",Georgia,serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--dus);outline-offset:2px}
.hidden{display:none!important}
.pad{padding:16px;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--f-display);margin:0;line-height:1.2}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:800;background:var(--dus);color:var(--bg);width:100%}
.kapat{flex:none;border:2px solid var(--bad);background:transparent;color:var(--bad);border-radius:10px;padding:7px 4px;font-weight:800;font-size:.8rem;margin-left:4px;width:6.4em;white-space:nowrap}
.kapat.armed{background:var(--bad);color:var(--bg)}
.kapat.done{border-color:var(--panel2);background:var(--panel2);color:var(--ink)}
.flash{position:fixed;inset:0;z-index:20;background:#17744E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;animation:fl .25s ease-out;transition:opacity .4s}
.flash.out{opacity:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bad);color:var(--bg);padding:.7em 1.2em;border-radius:.6em;font-weight:700;z-index:9;max-width:90vw;text-align:center}
.flash .ok{width:120px;height:120px;border-radius:50%;background:#fff;color:#17744E;font-size:78px;font-weight:800;display:grid;place-items:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.flash b{font-family:var(--f-display);font-size:1.8rem}
.flash span{opacity:.85}
@keyframes fl{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.flash,.flash .ok{animation:none}}
.tools button:disabled{opacity:.3}
.eopt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;width:100%;border-radius:12px;padding:14px 16px;border:2px solid var(--panel2);background:var(--panel2);color:var(--ink)}
.eopt b{font-size:1.05rem}
.eopt small{color:var(--soft);font-size:.82rem}
.eopt.bitir{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.eopt.bitir small{color:var(--bg);opacity:.85}
.eopt.acil{background:transparent;border-color:var(--bad)}
.eopt.acil b{color:var(--bad)}
.btn.end{background:transparent;border:2px solid var(--bad);color:var(--bad)}
.btn.end.armed{background:var(--bad);color:var(--bg)}
.phase.end{background:var(--bad);color:var(--bg)}
.btn.ghost{background:transparent;border:2px solid var(--panel2);color:var(--ink);font-weight:700}
.card{background:var(--panel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted);font-size:.9rem}
.err{color:var(--bad)}
/* uzaktan kumanda düzeni */
#remote{position:fixed;inset:0;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto auto;grid-template-columns:minmax(0,1fr);width:100%;max-width:640px;margin:0 auto;overflow:hidden}
#remote>*{min-width:0}
.hd{display:flex;align-items:center;gap:8px;padding:8px 12px 6px;padding-top:max(8px,env(safe-area-inset-top))}
.hd .t{flex:1;min-width:0}
.hd .t b{display:block;font-family:var(--f-display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-mono);color:var(--dus);font-size:.85rem;font-weight:700}
.stat{text-align:center;flex:none;min-width:2.8em}
.stat b{display:block;font-family:var(--f-mono);font-size:1.25rem;line-height:1}
.stat small{color:var(--muted);font-size:.66rem}
.pace{margin:0 12px 8px;border-radius:10px;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}.pace b{font-weight:800}.pace span{font-family:var(--f-mono);font-size:.85rem;opacity:.85}.pace.ok{background:var(--ok);color:var(--bg)}.pace.slow{background:var(--bad);color:#fff}.pace.fast{background:var(--dus);color:var(--bg)}.pace.idle{background:var(--panel2);color:var(--muted)}#remote.p-slow .hd{background:rgba(255,122,112,.22)}#remote.p-fast .hd{background:rgba(242,183,5,.22)}#remote.p-ok .hd{background:rgba(63,212,154,.16)}
.now{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:8px;padding:0 12px}
.thumb{position:relative;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:16/9;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .tag{position:absolute;left:6px;top:6px;background:var(--dus);color:var(--bg);font-weight:800;font-size:.72rem;border-radius:6px;padding:2px 6px}
.thumb .live{font-weight:800;color:var(--dus);text-align:center;padding:6px;font-size:.9rem}
.thumb.next{opacity:.7}
.phase{font-family:var(--f-mono);font-weight:800;font-size:.8rem;padding:3px 8px;border-radius:6px;background:var(--panel2)}
.phase.open{background:var(--ok);color:var(--bg)}
.phase.closed{background:var(--bad);color:var(--bg)}
.phase.reveal{background:var(--dus);color:var(--bg)}
.notes{overflow-y:auto;overflow-x:hidden;padding:10px 14px;font-size:1.05rem;line-height:1.5;color:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.notes .ttl{font-family:var(--f-display);font-weight:700;color:var(--ink);font-size:1.12rem;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px 12px}
.tools button{background:var(--panel2);border:0;border-radius:10px;padding:10px 2px;font-weight:700;font-size:.8rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools button.on{background:var(--dus);color:var(--bg)}
.nav{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px;padding:6px 12px max(12px,env(safe-area-inset-bottom))}
.nav button{border:0;border-radius:16px;font-weight:800;font-size:1.35rem;padding:22px 0}
.nav .prev{background:var(--panel2)}
.nav .next{background:var(--dus);color:var(--bg)}
.nav .next small{display:block;font-size:.75rem;font-weight:700;opacity:.8}
.pin{font-family:var(--f-mono);font-size:1.9rem;font-weight:800;letter-spacing:.14em;color:var(--dus)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:5}
.sheet .in{background:var(--panel);width:100%;max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px}
.slist{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slist button{border:0;padding:0;background:none;text-align:left;font-size:.72rem;color:var(--soft)}
.slist button .thumb{margin-bottom:3px}
.slist button.cur .thumb{outline:3px solid var(--dus)}
</style>
</head>

</html>
