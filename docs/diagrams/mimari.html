<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lam Başında · Canlı oturum mimarisi</title>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,650&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #faf7fb;
      --color-ink:     #22163a;
      --color-muted:   #5e5070;
      --color-soft:    #6e5f84;
      --color-accent:  #b0275b;
      --font-sans:     'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-serif:    'Literata', Georgia, 'Times New Roman', serif;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem);
      font-weight: 650;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 0.25rem;
    }
    .alt {
      font-size: 0.875rem;
      font-weight: 400;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    .diagram-container { width: 100%; max-width: 100%; min-width: 0; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1>Canlı oturum: kim neyi yazar, kim dinler</h1>
    <p class="alt">lam-basinda · 25 Kasım 2026</p>

    <div class="diagram-container">
    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lam-mimari-title lam-mimari-desc">
      <title id="lam-mimari-title">Lam Başında canlı oturum mimarisi</title>
      <desc id="lam-mimari-desc">Statik sayfalar GitHub Pages'ten üç tarayıcıya iner; kumanda Firestore'daki oturum belgesine o anki adımı yazar, öğrenci cevap yazıp canlı durumu okur, perde yalnız dinler, Firebase Auth rolleri ayırır.</desc>

      <defs>
        <marker id="lam-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5e5070"/></marker>
        <marker id="lam-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#5e5070"/></marker>
        <marker id="lam-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b0275b"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf7fb"/>

      <!-- Bölgeler (oklardan ve düğümlerden önce) -->
      <rect x="272" y="80" width="232" height="384" rx="12" fill="rgba(34,22,58,0.02)" stroke="rgba(34,22,58,0.10)" stroke-width="0.8"/>
      <rect x="348" y="84" width="80" height="12" rx="2" fill="#faf7fb"/>
      <text x="388" y="93" fill="#6e5f84" font-size="8" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle" letter-spacing="0.14em">TARAYICI</text>

      <rect x="632" y="80" width="232" height="240" rx="12" fill="rgba(34,22,58,0.02)" stroke="rgba(34,22,58,0.10)" stroke-width="0.8"/>
      <rect x="712" y="84" width="72" height="12" rx="2" fill="#faf7fb"/>
      <text x="748" y="93" fill="#6e5f84" font-size="8" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle" letter-spacing="0.14em">FIREBASE</text>

      <!-- Oklar (kutuların arkasında) -->
      <!-- Pages → üç tarayıcı -->
      <path d="M 200,256 H 232 Q 240,256 240,248 V 152 Q 240,144 248,144 H 288" fill="none" stroke="#5e5070" stroke-width="1" marker-end="url(#lam-arrow)"/>
      <line x1="200" y1="272" x2="288" y2="272" stroke="#5e5070" stroke-width="1" marker-end="url(#lam-arrow)"/>
      <path d="M 200,288 H 232 Q 240,288 240,296 V 392 Q 240,400 248,400 H 288" fill="none" stroke="#5e5070" stroke-width="1" marker-end="url(#lam-arrow)"/>

      <!-- Öğrenci ↔ Firestore -->
      <path d="M 488,144 H 560 Q 568,144 568,152 V 248 Q 568,256 576,256 H 648" fill="none" stroke="#5e5070" stroke-width="1.2" marker-end="url(#lam-arrow)" marker-start="url(#lam-arrow-start)"/>

      <!-- Kumanda → Firestore (birincil akış) -->
      <line x1="488" y1="272" x2="648" y2="272" stroke="#b0275b" stroke-width="1.4" marker-end="url(#lam-arrow-accent)"/>

      <!-- Firestore → Perde (dinleme) -->
      <path d="M 712,304 V 392 Q 712,400 704,400 H 488" fill="none" stroke="#5e5070" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#lam-arrow)"/>

      <!-- Auth → Firestore -->
      <line x1="748" y1="176" x2="748" y2="236" stroke="#5e5070" stroke-width="1.2" marker-end="url(#lam-arrow)"/>

      <!-- Ok etiketleri -->
      <rect x="488" y="194" width="72" height="12" rx="2" fill="#faf7fb"/>
      <text x="524" y="203" fill="#5e5070" font-size="8" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle" letter-spacing="0.08em">CEVAP · CANLI</text>

      <rect x="512" y="252" width="72" height="12" rx="2" fill="#faf7fb"/>
      <text x="548" y="261" fill="#b0275b" font-size="8" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle" letter-spacing="0.08em">ADIM · SORU</text>

      <rect x="720" y="338" width="40" height="12" rx="2" fill="#faf7fb"/>
      <text x="740" y="347" fill="#5e5070" font-size="8" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle" letter-spacing="0.08em">CANLI</text>

      <rect x="756" y="200" width="40" height="12" rx="2" fill="#faf7fb"/>
      <text x="776" y="209" fill="#5e5070" font-size="8" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle" letter-spacing="0.08em">KURAL</text>

      <!-- Düğüm: GitHub Pages -->
      <rect x="40" y="240" width="160" height="64" rx="8" fill="#faf7fb"/>
      <rect x="40" y="240" width="160" height="64" rx="8" fill="rgba(34,22,58,0.03)" stroke="rgba(34,22,58,0.30)" stroke-width="1"/>
      <rect x="48" y="248" width="44" height="12" rx="2" fill="transparent" stroke="rgba(34,22,58,0.22)" stroke-width="0.8"/>
      <text x="70" y="257" fill="#6e5f84" font-size="8" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle" letter-spacing="0.08em">STATİK</text>
      <text x="120" y="278" fill="#22163a" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">GitHub Pages</text>
      <text x="120" y="293" fill="#6e5f84" font-size="9" font-weight="500" font-family="'Figtree', sans-serif" text-anchor="middle">sayfa · slayt · quiz</text>

      <!-- Düğüm: Öğrenci -->
      <rect x="288" y="112" width="200" height="64" rx="8" fill="#faf7fb"/>
      <rect x="288" y="112" width="200" height="64" rx="8" fill="rgba(94,80,112,0.10)" stroke="#6e5f84" stroke-width="1"/>
      <rect x="296" y="120" width="52" height="12" rx="2" fill="transparent" stroke="rgba(110,95,132,0.40)" stroke-width="0.8"/>
      <text x="322" y="129" fill="#6e5f84" font-size="8" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle" letter-spacing="0.08em">TELEFON</text>
      <text x="388" y="150" fill="#22163a" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Öğrenci</text>
      <text x="388" y="165" fill="#6e5f84" font-size="9" font-weight="500" font-family="'Figtree', sans-serif" text-anchor="middle">anonim giriş · oturum kodu</text>

      <!-- Düğüm: Kumanda -->
      <rect x="288" y="240" width="200" height="64" rx="8" fill="#faf7fb"/>
      <rect x="288" y="240" width="200" height="64" rx="8" fill="rgba(94,80,112,0.10)" stroke="#6e5f84" stroke-width="1"/>
      <rect x="296" y="248" width="40" height="12" rx="2" fill="transparent" stroke="rgba(110,95,132,0.40)" stroke-width="0.8"/>
      <text x="316" y="257" fill="#6e5f84" font-size="8" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle" letter-spacing="0.08em">HOCA</text>
      <text x="388" y="278" fill="#22163a" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Kumanda</text>
      <text x="388" y="293" fill="#6e5f84" font-size="9" font-weight="500" font-family="'Figtree', sans-serif" text-anchor="middle">Google girişi · e-posta listesi</text>

      <!-- Düğüm: Perde -->
      <rect x="288" y="368" width="200" height="64" rx="8" fill="#faf7fb"/>
      <rect x="288" y="368" width="200" height="64" rx="8" fill="rgba(94,80,112,0.10)" stroke="#6e5f84" stroke-width="1"/>
      <rect x="296" y="376" width="44" height="12" rx="2" fill="transparent" stroke="rgba(110,95,132,0.40)" stroke-width="0.8"/>
      <text x="318" y="385" fill="#6e5f84" font-size="8" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle" letter-spacing="0.08em">EKRAN</text>
      <text x="388" y="406" fill="#22163a" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Perde</text>
      <text x="388" y="421" fill="#6e5f84" font-size="9" font-weight="500" font-family="'Figtree', sans-serif" text-anchor="middle">perde hesabı · yalnız okur</text>

      <!-- Düğüm: Firebase Auth -->
      <rect x="648" y="112" width="200" height="64" rx="8" fill="#faf7fb"/>
      <rect x="648" y="112" width="200" height="64" rx="8" fill="rgba(34,22,58,0.03)" stroke="rgba(34,22,58,0.30)" stroke-width="1"/>
      <rect x="656" y="120" width="36" height="12" rx="2" fill="transparent" stroke="rgba(34,22,58,0.22)" stroke-width="0.8"/>
      <text x="674" y="129" fill="#6e5f84" font-size="8" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
      <text x="748" y="150" fill="#22163a" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Firebase Auth</text>
      <text x="748" y="165" fill="#6e5f84" font-size="9" font-weight="500" font-family="'Figtree', sans-serif" text-anchor="middle">rolü firestore.rules ayırır</text>

      <!-- Düğüm: Firestore (odak) -->
      <rect x="648" y="240" width="200" height="64" rx="8" fill="#faf7fb"/>
      <rect x="648" y="240" width="200" height="64" rx="8" fill="rgba(176,39,91,0.08)" stroke="#b0275b" stroke-width="1"/>
      <rect x="656" y="248" width="40" height="12" rx="2" fill="transparent" stroke="rgba(176,39,91,0.50)" stroke-width="0.8"/>
      <text x="676" y="257" fill="#b0275b" font-size="8" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle" letter-spacing="0.08em">CANLI</text>
      <text x="748" y="278" fill="#22163a" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Firestore</text>
      <text x="748" y="293" fill="#6e5f84" font-size="9" font-weight="500" font-family="'Figtree', sans-serif" text-anchor="middle">oturum · adım · cevap</text>

      <!-- Lejant -->
      <line x1="40" y1="504" x2="920" y2="504" stroke="rgba(34,22,58,0.10)" stroke-width="0.8"/>
      <text x="40" y="520" fill="#6e5f84" font-size="8" font-weight="600" font-family="'Figtree', sans-serif" letter-spacing="0.14em">LEJANT</text>

      <rect x="40" y="536" width="14" height="10" rx="2" fill="rgba(176,39,91,0.08)" stroke="#b0275b" stroke-width="1"/>
      <text x="60" y="544" fill="#5e5070" font-size="8.5" font-family="'Figtree', sans-serif">Odak · canlı veri</text>

      <rect x="164" y="536" width="14" height="10" rx="2" fill="rgba(94,80,112,0.10)" stroke="#6e5f84" stroke-width="1"/>
      <text x="184" y="544" fill="#5e5070" font-size="8.5" font-family="'Figtree', sans-serif">Tarayıcı</text>

      <rect x="248" y="536" width="14" height="10" rx="2" fill="rgba(34,22,58,0.03)" stroke="rgba(34,22,58,0.30)" stroke-width="1"/>
      <text x="268" y="544" fill="#5e5070" font-size="8.5" font-family="'Figtree', sans-serif">Dış servis</text>

      <line x1="352" y1="541" x2="380" y2="541" stroke="#b0275b" stroke-width="1.4" marker-end="url(#lam-arrow-accent)"/>
      <text x="388" y="544" fill="#5e5070" font-size="8.5" font-family="'Figtree', sans-serif">Birincil akış</text>

      <line x1="480" y1="541" x2="508" y2="541" stroke="#5e5070" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#lam-arrow)"/>
      <text x="516" y="544" fill="#5e5070" font-size="8.5" font-family="'Figtree', sans-serif">Canlı dinleme</text>

      <line x1="612" y1="541" x2="640" y2="541" stroke="#5e5070" stroke-width="1" marker-end="url(#lam-arrow)"/>
      <text x="648" y="544" fill="#5e5070" font-size="8.5" font-family="'Figtree', sans-serif">Sayfa iner · yazar</text>
    </svg>
    </div>
  </div>
</body>
</html>
